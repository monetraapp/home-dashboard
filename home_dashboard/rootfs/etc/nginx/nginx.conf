worker_processes  1;
error_log         /proc/1/fd/1 warn;
pid               /var/run/nginx.pid;
daemon            off;

events {
    worker_connections  1024;
}

http {
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    access_log          /proc/1/fd/1;
    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    server_tokens       off;

    gzip                on;
    gzip_min_length     1024;
    gzip_types          text/plain text/css application/javascript application/json
                        image/svg+xml font/woff2;

    server {
        listen 8099 default_server;

        # Doar Supervisor-ul are voie să ajungă aici. Portul nu e publicat pe
        # host, dar păstrăm restricţia ca strat suplimentar.
        allow 172.30.32.2;
        deny  all;

        root  /var/www;
        index index.html;

        # Asset-urile Vite au hash în nume, deci pot fi cache-uite agresiv.
        location /assets/ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            try_files  $uri =404;
        }

        # index.html nu se cache-uieşte, ca o versiune nouă de add-on
        # să fie preluată imediat după restart.
        location / {
            add_header Cache-Control "no-cache";
            try_files  $uri $uri/ /index.html;
        }
    }
}
