# https://developers.home-assistant.io/docs/add-ons/configuration
name: Home Dashboard
version: "1.1.3"
slug: home_dashboard
description: Dashboard propriu pentru casă, conectat live la Home Assistant prin WebSocket
url: "https://github.com/monetraapp/home-dashboard/tree/main/home_dashboard"

arch:
  - aarch64
  - amd64

# Imaginea de bază are deja s6-overlay, deci nu mai adăugăm init-ul Supervisor-ului.
init: false

# Ingress: HA proxează add-on-ul sub /api/hassio_ingress/<token>/ şi îl adaugă
# singur în bara laterală. Nu publicăm niciun port pe host — dashboard-ul e
# accesibil doar prin Home Assistant, cu autentificarea lui.
ingress: true
ingress_port: 8099
panel_icon: mdi:view-dashboard-variant
panel_title: Home Dashboard
panel_admin: true

options:
  log_level: info

schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
