<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=EB+Garamond:wght@400;500&family=Doto:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* --- copiat 1:1 din <helmet> al designului Home Dashboard.dc.html --- */
    body { margin: 0; background: #150c05; }
    * { box-sizing: border-box; }
    ::selection { background: rgba(242,140,40,0.4); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    @keyframes ringOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes ringOrbitRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    @keyframes ringPulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes dashFlow { to { stroke-dashoffset: -28; } }
    @keyframes arcRun { from { stroke-dashoffset: 14; } to { stroke-dashoffset: -100; } }
    @keyframes arcRunSoft { from { stroke-dashoffset: 22; } to { stroke-dashoffset: -100; } }
    @keyframes airflowPulse { 0%, 100% { opacity: 0.14; transform: scaleY(0.94); } 50% { opacity: 0.85; transform: scaleY(1.05); } }
    @keyframes waftDown { 0% { opacity: 0; transform: translateY(-4px) scale(0.7); } 22% { opacity: 0.65; } 100% { opacity: 0; transform: translateY(34px) scale(1.15); } }
    @keyframes glowBreath { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
    /* adăugat: banda de offline nu trebuie să afecteze layout-ul de dedesubt */
    @keyframes offlinePulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
